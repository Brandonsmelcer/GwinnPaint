<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>CPU Temp Alert</title>
    <meta description="Solid green when the CPU is cool, blue when it is getting warm, and flashing red when it is overheating. Use Force Red Flash or Test Temperature to preview colors without stressing the CPU." />
    <meta publisher="Custom" />
    <meta property="forceRed" label="Force Red Flash" type="boolean" default="0" tooltip="Turn this on to test flashing red. It ignores temperature." />
    <meta property="testMode" label="Test Mode (ignore real CPU)" type="boolean" default="1" tooltip="Uses the Test Temperature slider instead of the live CPU sensor." />
    <meta property="testTemp" label="Test Temperature (C)" type="number" min="20" max="110" default="45" tooltip="Fake CPU temperature used while Test Mode is on. 90 or higher flashes red." />
    <meta property="safeTemp" label="Safe Below (C)" type="number" min="30" max="90" default="65" tooltip="Solid green at or below this temperature." />
    <meta property="hotTemp" label="Overheat At (C)" type="number" min="50" max="110" default="90" tooltip="Flashing red at or above this temperature. Blue is used between Safe and Overheat." />
    <meta property="flashSpeed" label="Flash Speed" type="number" min="1" max="10" default="3" />
    <meta property="safeColor" label="Safe Color" type="color" default="#00cc44" min="0" max="360" />
    <meta property="warmColor" label="Warm Color" type="color" default="#0088ff" min="0" max="360" />
    <meta property="hotColor" label="Overheat Color" type="color" default="#ff0000" min="0" max="360" />
    <meta property="cpuSensor" label="CPU Temperature Sensor" type="sensor" tooltip="Pick CPU Temperature, not CPU Fan. Only used when Test Mode is off." />
</head>
<body style="margin:0;padding:0;background:#000;overflow:hidden;">
    <canvas id="exCanvas" width="320" height="200"></canvas>
    <script>
        var canvas = document.getElementById("exCanvas");
        var ctx = canvas.getContext("2d");
        var width = 320;
        var height = 200;

        function toNumber(value, fallback) {
            if (typeof value === "number" && isFinite(value)) {
                return value;
            }
            if (value == null || value === "") {
                return fallback;
            }
            var parsed = parseFloat(String(value).replace(",", "."));
            return isFinite(parsed) ? parsed : fallback;
        }

        function toColor(value, fallback) {
            if (typeof value === "number" && isFinite(value)) {
                return "hsl(" + value + ", 100%, 50%)";
            }
            if (typeof value === "string") {
                var trimmed = value.replace(/^\s+|\s+$/g, "");
                if (trimmed.charAt(0) === "#" || trimmed.indexOf("rgb") === 0 || trimmed.indexOf("hsl") === 0) {
                    return trimmed;
                }
            }
            return fallback;
        }

        function isOn(value) {
            return value === 1 || value === true || value === "1" || value === "true" || value === "True" || value === "on";
        }

        function readSetting(name, fallback) {
            try {
                if (typeof window[name] !== "undefined") {
                    return window[name];
                }
            } catch (error) {}
            return fallback;
        }

        function readCpuTemp() {
            if (isOn(readSetting("forceRed", 0))) {
                return 999;
            }

            var usingTestSlider = isOn(readSetting("testMode", 1));
            if (usingTestSlider) {
                return toNumber(readSetting("testTemp", 45), 45);
            }

            try {
                var sensorName = readSetting("cpuSensor", "");
                if (!sensorName || typeof engine === "undefined") {
                    return toNumber(readSetting("testTemp", 45), 45);
                }

                var getter = engine.getSensorValue || engine.GetSensorValue;
                if (!getter) {
                    return toNumber(readSetting("testTemp", 45), 45);
                }

                var reading = getter.call(engine, sensorName);
                if (reading == null) {
                    return null;
                }
                if (typeof reading === "number") {
                    return isFinite(reading) ? reading : null;
                }
                var nested = toNumber(reading.value, NaN);
                return isFinite(nested) ? nested : null;
            } catch (error) {
                return null;
            }
        }

        function colorForTemp(temp) {
            var safeLimit = toNumber(readSetting("safeTemp", 65), 65);
            var hotLimit = toNumber(readSetting("hotTemp", 90), 90);
            var safe = toColor(readSetting("safeColor", "#00cc44"), "#00cc44");
            var warm = toColor(readSetting("warmColor", "#0088ff"), "#0088ff");
            var hot = toColor(readSetting("hotColor", "#ff0000"), "#ff0000");

            if (temp == null) {
                return "rgb(26,26,26)";
            }

            temp = toNumber(temp, 0);

            if (temp >= hotLimit) {
                var speed = Math.max(1, toNumber(readSetting("flashSpeed", 3), 3));
                var halfMs = 1200 / speed;
                var flashingOn = (Date.now() % (halfMs * 2)) < halfMs;
                return flashingOn ? hot : "rgb(0,0,0)";
            }
            if (temp > safeLimit) {
                return warm;
            }
            return safe;
        }

        function update() {
            ctx.fillStyle = colorForTemp(readCpuTemp());
            ctx.fillRect(0, 0, width, height);
            window.requestAnimationFrame(update);
        }

        window.requestAnimationFrame(update);
    </script>
</body>
</html>
